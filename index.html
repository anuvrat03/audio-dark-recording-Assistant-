<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Screen Assistant</title>
    <style>
        /* Modern Dark Theme Tailored for Samsung Galaxy S20 FE */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: #38bdf8;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #0369a1;
        }

        .btn-share {
            background-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .btn-share:active {
            background-color: #059669;
        }

        .btn-download {
            background-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            display: none;
        }

        .btn-download:active {
            background-color: #4f46e5;
        }

        /* Full Blackout Overlay */
        #recording-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 20px;
        }

        .recording-status {
            color: #ef4444;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Prominent Stop Button For One-Thumb Access */
        #stop-btn {
            background-color: #334155;
            color: #ffffff;
            border: 2px solid #64748b;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            transition: all 0.2s ease;
            width: 80%;
            max-width: 280px;
        }

        #stop-btn:active {
            background-color: #dc2626;
            border-color: #ef4444;
            transform: scale(0.96);
        }

        video {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: none;
            background-color: #000000;
        }

        .error-msg {
            color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>Dark Screen Assistant</h2>
        <p>Records lecture notes with a pitch-black screen using your rear camera to eliminate distraction and save battery power.</p>
        
        <div id="error-msg" class="error-msg"></div>

        <button class="btn" id="start-btn">Start Dark Recording</button>

        <video id="playback-video" controls></video>

        <!-- Action Buttons for Native Sharing & Download -->
        <button class="btn btn-share" id="share-btn">📲 Share Note (WhatsApp / Drive / Apps)</button>
        <button class="btn btn-download" id="download-btn">💾 Save to Phone Downloads</button>
    </div>

    <!-- Blackout Overlay Screen -->
    <div id="recording-overlay">
        <div class="recording-status">● RECORDING (REAR CAMERA)</div>
        <button id="stop-btn">⏹ STOP RECORDING</button>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let mediaStream = null;
        let recordedFile = null;
        let recordedBlobUrl = null;

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const shareBtn = document.getElementById('share-btn');
        const downloadBtn = document.getElementById('download-btn');
        const overlay = document.getElementById('recording-overlay');
        const mainCard = document.getElementById('main-card');
        const playbackVideo = document.getElementById('playback-video');
        const errorMsg = document.getElementById('error-msg');

        // Start Recording Process with Strict Rear Camera Enforcement
        startBtn.addEventListener('click', async () => {
            errorMsg.style.display = 'none';
            shareBtn.style.display = 'none';
            downloadBtn.style.display = 'none';
            recordedChunks = [];

            try {
                let videoConstraint = { facingMode: { exact: "environment" } };
                
                try {
                    // Attempt strict rear camera constraint first
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: videoConstraint,
                        audio: true
                    });
                } catch (strictErr) {
                    // Fallback: Scan available device cameras to explicitly locate the rear-facing lens
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    const rearCamera = videoDevices.find(d => 
                        d.label.toLowerCase().includes('back') || 
                        d.label.toLowerCase().includes('rear') || 
                        d.label.toLowerCase().includes('environment') ||
                        d.label.toLowerCase().includes('tele') ||
                        d.label.toLowerCase().includes('ultra')
                    );

                    if (rearCamera) {
                        mediaStream = await navigator.mediaDevices.getUserMedia({
                            video: { deviceId: { exact: rearCamera.deviceId } },
                            audio: true
                        });
                    } else if (videoDevices.length > 1) {
                        // Usually the second camera index on mobile phones is the rear camera
                        mediaStream = await navigator.mediaDevices.getUserMedia({
                            video: { deviceId: { exact: videoDevices[videoDevices.length - 1].deviceId } },
                            audio: true
                        });
                    } else {
                        // Ultimate fallback
                        mediaStream = await navigator.mediaDevices.getUserMedia({
                            video: true,
                            audio: true
                        });
                    }
                }

                // Determine supported encoding format
                let mimeType = 'video/webm';
                if (!MediaRecorder.isTypeSupported('video/webm')) {
                    mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : '';
                }

                const options = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(mediaStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const actualMime = mediaRecorder.mimeType || 'video/webm';
                    const extension = actualMime.includes('mp4') ? 'mp4' : 'webm';
                    const fileName = `Dark_Recording_${Date.now()}.${extension}`;

                    const blob = new Blob(recordedChunks, { type: actualMime });
                    recordedFile = new File([blob], fileName, { type: actualMime });
                    recordedBlobUrl = URL.createObjectURL(blob);
                    
                    playbackVideo.src = recordedBlobUrl;
                    playbackVideo.style.display = 'block';

                    shareBtn.style.display = 'block';
                    downloadBtn.style.display = 'block';

                    overlay.style.display = 'none';
                    mainCard.style.display = 'block';

                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }
                };

                mediaRecorder.start(1000);

                mainCard.style.display = 'none';
                overlay.style.display = 'flex';

            } catch (err) {
                errorMsg.innerText = "Camera access error: " + err.message;
                errorMsg.style.display = 'block';
            }
        });

        // Stop Recording
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });

        // Native Android Share Functionality
        shareBtn.addEventListener('click', async () => {
            if (recordedFile && navigator.canShare && navigator.canShare({ files: [recordedFile] })) {
                try {
                    await navigator.share({
                        title: 'Dark Screen Recording',
                        text: 'Recorded via Dark Screen Assistant',
                        files: [recordedFile]
                    });
                } catch (shareError) {
                    if (shareError.name !== 'AbortError') {
                        alert('Share error: ' + shareError.message);
                    }
                }
            } else {
                alert('Direct file sharing is not supported by your current browser view. Use the Download button to save the file locally!');
            }
        });

        // Direct Download Action
        downloadBtn.addEventListener('click', () => {
            if (recordedBlobUrl) {
                const a = document.createElement('a');
                a.href = recordedBlobUrl;
                a.download = recordedFile ? recordedFile.name : 'Dark_Recording.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
