<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Audio & Translation Assistant</title>
    <style>
        /* Modern Dark Theme Tailored for Samsung Galaxy S20 FE */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 0;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: #38bdf8;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Input field for API key saving */
        .api-input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .api-input-group label {
            font-size: 0.8rem;
            color: #38bdf8;
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .api-input {
            width: 100%;
            padding: 10px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.85rem;
            outline: none;
        }

        .api-input:focus {
            border-color: #38bdf8;
        }

        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #0369a1;
        }

        .btn-share {
            background-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .btn-download {
            background-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            display: none;
        }

        /* Full Blackout Overlay */
        #recording-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 20px;
        }

        .recording-status {
            color: #ef4444;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Prominent Stop Button For One-Thumb Access */
        #stop-btn {
            background-color: #334155;
            color: #ffffff;
            border: 2px solid #64748b;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            width: 80%;
            max-width: 280px;
        }

        #stop-btn:active {
            background-color: #dc2626;
            border-color: #ef4444;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
            display: none;
        }

        /* Translation Output Box */
        .output-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            margin-top: 15px;
            text-align: left;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .output-box h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 0.95rem;
        }

        .output-box p {
            font-size: 0.85rem;
            color: #e2e8f0;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .loading-text {
            color: #fbbf24;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .error-msg {
            color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>Dark Audio & Translator</h2>
        <p>Records voice notes in pitch-black mode, then automatically translates them into English and Hindi.</p>
        
        <!-- On-Screen API Key Input (Saves Privately in Browser Storage) -->
        <div class="api-input-group">
            <label for="api-key-input">🔑 OpenRouter API Key:</label>
            <input type="password" id="api-key-input" class="api-input" placeholder="Paste your OpenRouter key here...">
        </div>

        <div id="error-msg" class="error-msg"></div>

        <button class="btn" id="start-btn">Start Dark Recording</button>

        <audio id="playback-audio" controls></audio>

        <div id="loading-box" class="loading-text">⏳ Processing AI Transcription & Translation...</div>

        <!-- Translation Results Container -->
        <div id="results-box" class="output-box">
            <h4>🇬🇧 English Translation:</h4>
            <p id="english-text">-</p>
            <h4>🇮🇳 Hindi Translation (हिंदी):</h4>
            <p id="hindi-text">-</p>
        </div>

        <!-- Action Buttons for Native Sharing & Download -->
        <button class="btn btn-share" id="share-btn">📲 Share Note & Translations</button>
        <button class="btn btn-download" id="download-btn">💾 Save Audio to Phone</button>
    </div>

    <!-- Blackout Overlay Screen -->
    <div id="recording-overlay">
        <div class="recording-status">● RECORDING AUDIO (DARK DISPLAY)</div>
        <button id="stop-btn">⏹ STOP RECORDING</button>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let mediaStream = null;
        let recordedFile = null;
        let recordedBlobUrl = null;
        let translationSummary = "";

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const shareBtn = document.getElementById('share-btn');
        const downloadBtn = document.getElementById('download-btn');
        const overlay = document.getElementById('recording-overlay');
        const mainCard = document.getElementById('main-card');
        const playbackAudio = document.getElementById('playback-audio');
        const errorMsg = document.getElementById('error-msg');
        const loadingBox = document.getElementById('loading-box');
        const resultsBox = document.getElementById('results-box');
        const englishText = document.getElementById('english-text');
        const hindiText = document.getElementById('hindi-text');
        const apiKeyInput = document.getElementById('api-key-input');

        // Load saved API Key from browser local storage on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('openrouter_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });

        // Save Key whenever user changes it
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('openrouter_key', apiKeyInput.value.trim());
        });

        // Start Recording Process
        startBtn.addEventListener('click', async () => {
            const currentApiKey = apiKeyInput.value.trim();
            if (!currentApiKey) {
                errorMsg.innerText = "Please paste your OpenRouter API key above before recording.";
                errorMsg.style.display = 'block';
                return;
            } else {
                localStorage.setItem('openrouter_key', currentApiKey);
            }

            errorMsg.style.display = 'none';
            shareBtn.style.display = 'none';
            downloadBtn.style.display = 'none';
            resultsBox.style.display = 'none';
            recordedChunks = [];

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported('audio/webm')) {
                    mimeType = MediaRecorder.isTypeSupported('audio/ogg') ? 'audio/ogg' : '';
                }

                const options = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(mediaStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const actualMime = mediaRecorder.mimeType || 'audio/webm';
                    const extension = actualMime.includes('ogg') ? 'ogg' : 'webm';
                    const fileName = `Dark_Audio_Note_${Date.now()}.${extension}`;

                    const blob = new Blob(recordedChunks, { type: actualMime });
                    recordedFile = new File([blob], fileName, { type: actualMime });
                    recordedBlobUrl = URL.createObjectURL(blob);
                    
                    playbackAudio.src = recordedBlobUrl;
                    playbackAudio.style.display = 'block';

                    shareBtn.style.display = 'block';
                    downloadBtn.style.display = 'block';

                    overlay.style.display = 'none';
                    mainCard.style.display = 'block';

                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }

                    // Process Translation
                    await processAudioWithAI(blob, currentApiKey);
                };

                mediaRecorder.start(1000);

                mainCard.style.display = 'none';
                overlay.style.display = 'flex';

            } catch (err) {
                errorMsg.innerText = "Microphone error: " + err.message;
                errorMsg.style.display = 'block';
            }
        });

        // Stop Recording
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        });

        // Query OpenRouter AI
        async function processAudioWithAI(audioBlob, apiKey) {
            loadingBox.style.display = 'block';

            try {
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = async () => {
                    const base64Audio = reader.result;

                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href,
                            "X-Title": "Dark Audio Assistant"
                        },
                        body: JSON.stringify({
                            model: "google/gemini-2.5-flash",
                            messages: [
                                {
                                    role: "user",
                                    content: [
                                        {
                                            type: "text",
                                            text: "Listen to this recorded audio note. Provide two things: 1. A clean translation/transcription in English. 2. A clean translation in Hindi (हिंदी). Format your exact response as JSON with keys 'english' and 'hindi'."
                                        },
                                        {
                                            type: "input_audio",
                                            input_audio: {
                                                data: base64Audio.split(',')[1],
                                                format: audioBlob.type.includes('ogg') ? 'ogg' : 'webm'
                                            }
                                        }
                                    ]
                                }
                            ]
                        })
                    });

                    const data = await response.json();
                    loadingBox.style.display = 'none';

                    if (data.choices && data.choices[0]) {
                        let content = data.choices[0].message.content;
                        try {
                            if (content.includes('```json')) {
                                content = content.split('```json')[1].split('```')[0].trim();
                            } else if (content.includes('```')) {
                                content = content.split('```')[1].split('```')[0].trim();
                            }
                            const parsed = JSON.parse(content);
                            englishText.innerText = parsed.english || "Transcription complete.";
                            hindiText.innerText = parsed.hindi || "अनुवाद उपलब्ध है।";
                            translationSummary = `\n\n--- TRANSLATIONS ---\nEnglish: ${parsed.english}\nHindi: ${parsed.hindi}`;
                        } catch (parseErr) {
                            englishText.innerText = content;
                            hindiText.innerText = "See English transcription above.";
                            translationSummary = `\n\n--- TRANSCRIPT ---\n${content}`;
                        }
                        resultsBox.style.display = 'block';
                    } else {
                        errorMsg.innerText = "AI processing error: " + (data.error?.message || "Unknown response");
                        errorMsg.style.display = 'block';
                    }
                };
            } catch (err) {
                loadingBox.style.display = 'none';
                errorMsg.innerText = "Network translation error: " + err.message;
                errorMsg.style.display = 'block';
            }
        }

        // Native Android Share
        shareBtn.addEventListener('click', async () => {
            if (recordedFile && navigator.canShare && navigator.canShare({ files: [recordedFile] })) {
                try {
                    await navigator.share({
                        title: 'Dark Audio Note & Translation',
                        text: 'Here is my recorded audio note and translations.' + translationSummary,
                        files: [recordedFile]
                    });
                } catch (shareError) {
                    if (shareError.name !== 'AbortError') {
                        alert('Share error: ' + shareError.message);
                    }
                }
            } else {
                alert('Direct file sharing not supported on this view. Use the Download button!');
            }
        });

        // Direct Download
        downloadBtn.addEventListener('click', () => {
            if (recordedBlobUrl) {
                const a = document.createElement('a');
                a.href = recordedBlobUrl;
                a.download = recordedFile ? recordedFile.name : 'Dark_Audio_Note.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
