<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Speech & Translation Assistant</title>
    <style>
        /* Modern Dark Theme Tailored for Samsung Galaxy S20 FE */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 0;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: #38bdf8;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #0369a1;
        }

        .btn-share {
            background-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            display: none;
        }

        .btn-download {
            background-color: #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            display: none;
        }

        /* Full Blackout Overlay */
        #recording-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 20px;
        }

        .recording-status {
            color: #ef4444;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Prominent Stop Button For One-Thumb Access */
        #stop-btn {
            background-color: #334155;
            color: #ffffff;
            border: 2px solid #64748b;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            width: 80%;
            max-width: 280px;
        }

        #stop-btn:active {
            background-color: #dc2626;
            border-color: #ef4444;
        }

        /* Transcription & Translation Output Box */
        .output-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            margin-top: 15px;
            text-align: left;
            display: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .output-box h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 0.95rem;
        }

        .output-box p {
            font-size: 0.85rem;
            color: #e2e8f0;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .error-msg {
            color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>Dark Speech Assistant</h2>
        <p>Record notes in pitch-black mode. Automatically captures your speech in English or Hindi instantly for free with zero API keys.</p>
        
        <div id="error-msg" class="error-msg"></div>

        <button class="btn" id="start-btn">Start Dark Recording</button>

        <!-- Results Container -->
        <div id="results-box" class="output-box">
            <h4>🗣️ Captured Speech / Transcript:</h4>
            <p id="transcript-text">-</p>
        </div>

        <!-- Action Buttons for Native Sharing & Download Text -->
        <button class="btn btn-share" id="share-btn">📲 Share Transcript & Notes</button>
        <button class="btn btn-download" id="download-btn">💾 Save Notes as Text File</button>
    </div>

    <!-- Blackout Overlay Screen -->
    <div id="recording-overlay">
        <div class="recording-status">● LISTENING & TRANSCRIBING (DARK SCREEN)</div>
        <button id="stop-btn">⏹ STOP RECORDING</button>
    </div>

    <script>
        let recognition;
        let finalTranscript = "";
        let isRecording = false;

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const shareBtn = document.getElementById('share-btn');
        const downloadBtn = document.getElementById('download-btn');
        const overlay = document.getElementById('recording-overlay');
        const mainCard = document.getElementById('main-card');
        const errorMsg = document.getElementById('error-msg');
        const resultsBox = document.getElementById('results-box');
        const transcriptText = document.getElementById('transcript-text');

        // Initialize Browser Speech Recognition API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            errorMsg.innerText = "Speech recognition is not supported on this browser. Please use Google Chrome.";
            errorMsg.style.display = 'block';
            startBtn.disabled = true;
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-IN'; // Set to Indian English & bilingual speech support

            recognition.onresult = (event) => {
                let interim = "";
                finalTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                transcriptText.innerText = finalTranscript || interim || "Listening...";
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
            };

            recognition.onend = () => {
                if (isRecording) {
                    try { recognition.start(); } catch (e) {}
                }
            };
        }

        // Start Recording Process
        startBtn.addEventListener('click', () => {
            errorMsg.style.display = 'none';
            resultsBox.style.display = 'none';
            finalTranscript = "";
            transcriptText.innerText = "";

            if (recognition) {
                try {
                    isRecording = true;
                    recognition.start();
                    mainCard.style.display = 'none';
                    overlay.style.display = 'flex';
                } catch (err) {
                    errorMsg.innerText = "Could not start speech recognition: " + err.message;
                    errorMsg.style.display = 'block';
                }
            }
        });

        // Stop Recording
        stopBtn.addEventListener('click', () => {
            isRecording = false;
            if (recognition) {
                recognition.stop();
            }

            overlay.style.display = 'none';
            mainCard.style.display = 'block';

            if (finalTranscript.trim() !== "") {
                transcriptText.innerText = finalTranscript;
                resultsBox.style.display = 'block';
                shareBtn.style.display = 'block';
                downloadBtn.style.display = 'block';
            } else {
                transcriptText.innerText = "No speech detected. Please try again.";
                resultsBox.style.display = 'block';
            }
        });

        // Native Android Share Functionality
        shareBtn.addEventListener('click', async () => {
            const shareText = `--- DARK SPEECH NOTE ---\n${finalTranscript}`;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Dark Speech Note',
                        text: shareText
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        alert('Share error: ' + err.message);
                    }
                }
            } else {
                alert('Sharing not supported on this view.');
            }
        });

        // Direct Download as Text File
        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([finalTranscript], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Speech_Note_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
